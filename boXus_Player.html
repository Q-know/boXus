<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>boXus Player</title>

<style>
body {
    margin: 0;
    font-family: sans-serif;
    display: flex;
    justify-content: center;  /* 横中央 */
}

#app {
    display: flex;
    flex-direction: column;
    align-items: center;      /* 中身中央 */
    margin-top: 30px;
}

.controls {
    margin-bottom: 15px;
}

#hand {
    margin-top: 20px;
    margin-bottom: 30px;  /* ← これがチェックボタンとの間隔 */
}

#result {
    text-align: center;
    margin-top: 12px;
    font-size: 20px;
    font-weight: bold;
}

.result-clear {
    color: #2ecc71;
}

.result-error {
    color: #e74c3c;
}

#modeControls {
    margin-top: 15px;
    margin-bottom: 15px;
    display: flex;
    gap: 10px;
}

#modeControls button {
    padding: 6px 14px;
    cursor: pointer;
}

.active-normal {
    background-color: #90caf9;   /* 青 */
    font-weight: bold;
}

.active-memo {
    background-color: #f48fb1;   /* ピンク */
    font-weight: bold;
}

.hand-dimmed {
    opacity: 0.4;
    transition: opacity 0.2s ease;
}

.hand-dimmed button {
    pointer-events: none;
}

/* 数字列 */
#memoNumbersRow {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-bottom: 6px;
}

/* ○×列 */
#memoMarksRow {
    display: flex;
    justify-content: center;
    gap: 6px;      /* ← 近づける */
    margin-top: 6px;
}

/* ○×ボタン */
#memoMarksRow button {
    padding: 6px 24px;   /* ← 横幅を広げる */
    font-size: 20px;     /* ← 少し大きく */
    min-width: 124px;     /* ← 横に広く */
}

#actionButtons {
    display: flex;
    gap: 15px;
    margin-top: 25px;
}

.reset-button {
    padding: 8px 18px;
    font-size: 16px;
    cursor: pointer;
}

.check-button {
    padding: 14px 28px;
    font-size: 20px;
    font-weight: bold;
}

#board td {
    background-color: white;
}

#historyControls {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 10px;
}

#historyControls button {
    font-size: 16px;
    padding: 6px 14px;
}

#checkBtn {
    display: block;
    margin: 18px auto 0 auto;
    padding: 10px 40px;
    font-size: 18px;
    width: 200px;
    font-weight: bold;
}

#board {
    border: 2px solid #444;
    padding: 0px;
    display: inline-block;
}

/* クリア時 */
.board-clear {
    border-color: #2ecc71;
    box-shadow: 0 0 16px #2ecc71;
}

</style>

</head>

<body>

<div id="app">

    <h2>boXus Player ver.1.1</h2>

    <div class="controls">
        <input type="file" id="loadFile" accept=".json">
    </div>

    <div id="board"></div>   <!-- 先に盤面 -->

    <div id="hand"></div>    <!-- 下に手札 -->

    <div id="modeControls">
        <button id="normalModeBtn">配置モード</button>
        <button id="memoModeBtn">メモモード</button>
    </div>

    <div id="memoInput" style="display:none; margin-bottom:15px;">

        <!-- 数字列 -->
        <div id="memoNumbersRow"></div>

        <!-- ○×列 -->
        <div id="memoMarksRow">
            <button id="circleBtn">○</button>
            <button id="crossBtn">×</button>
        </div>

    </div>

    <div id="historyControls">
    <button id="undoBtn">↶ Undo</button>
    <button id="redoBtn">Redo ↷</button>
    <button id="resetBtn">Reset</button>
</div>

<button id="checkBtn">チェック</button>

<p id="result"></p>

</div>

<script type="module" src="player.js"></script>

</body>
</html>
